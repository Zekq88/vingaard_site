name: Deploy Vingaard Site

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
  
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cheackout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build frontend image
        run: |
          docker build \
          -t ghcr.io/zekq88/vingaard-frontend:latest \
          ./frontned/WebAppFrontend.Wasm

      - name: Build backend image
        run: |
          docker build \
          -t ghcr.io/zekq88/vingaard-backend:latest \
          -f Dockerfile.backend .

      - name: Push frontend image
        run: docker push ghcr.io/zekq88/vingaard-frontend:latest

      - name: Push backend image
        run: docker push ghcr.io/zekq88/vingaard-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          
          script: |
            docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }}

            cd ~/vingaard-site/AI_OD_Model_Django_Blazor

            docker-compose down --remove-orphans

            docker pull ghcr.io/zekq88/vingaard-frontend:latest
            docker pull ghcr.io/zekq88/vingaard-backend:latest

            docker-compose up -d --force-recreate

            docker image prune -af
            docker builder prune -f
            docker container prune -f