apiVersion: apps/v1
kind: Deployment
metadata:
  name: vingaard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vingaard-frontend
  template:
    metadata:
      labels:
        app: vingaard-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/zekq88/vingaard-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  - name: vingaard-frontend-service
spec:
  selector:
    app: vingaard-frontend
  ports:
    - port: 80
      targetPort: 80